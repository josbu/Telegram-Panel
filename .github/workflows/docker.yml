name: Docker Build & Publish

on:
  push:
    branches:
      - main
      - dev
    tags:
      - "v*"
  pull_request:
    branches:
      - main
      - dev
    paths:
      - "Dockerfile"
      - "Dockerfile.local"
      - "docker/**"
      - "docker-compose.yml"
      - "Directory.Build.props"
      - "frontend/**"
      - "src/**"
      - ".github/workflows/docker.yml"
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate release tag version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          set -euo pipefail
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PROJECT_VERSION="$(sed -n 's:.*<Version>\([^<]*\)</Version>.*:\1:p' Directory.Build.props | head -n 1)"
          if [[ -z "$PROJECT_VERSION" || "$PROJECT_VERSION" != "$TAG_VERSION" ]]; then
            echo "Tag version $TAG_VERSION does not match Directory.Build.props version $PROJECT_VERSION" >&2
            exit 1
          fi

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 仅在非 PR 事件时登录 GHCR（PR 不推送镜像）
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 生成镜像标签：
      # - main 分支：latest + main
      # - dev 分支：dev + dev-latest
      # - tag（如 v1.2.3）：v1.2.3
      # - 额外附带短 SHA 标签便于定位
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=dev-latest,enable=${{ github.ref == 'refs/heads/dev' }}
            type=sha,prefix=sha-

      - name: Select Docker platforms
        id: platforms
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == "refs/heads/dev" ]]; then
            echo "value=linux/amd64" >> "${GITHUB_OUTPUT}"
          else
            echo "value=linux/amd64,linux/arm64" >> "${GITHUB_OUTPUT}"
          fi

      - name: Build and (optionally) push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ steps.platforms.outputs.value }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

